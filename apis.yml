aid: oneshot
name: OneShot
description: >-
  OneShot (oneshot.ai) is an autonomous outbound sales prospecting platform that
  uses generative AI, machine learning, and reinforcement learning to automate
  the manual work of B2B prospecting. It sources ideal-customer-profile (ICP)
  leads from 35+ data providers, manages email and domain health, generates
  hyper-personalized messaging for email and LinkedIn, and can run fully
  autonomous 24/7 outreach that books qualified meetings. The product ships as a
  Chrome extension and a web application, and integrates natively with HubSpot,
  Salesforce, Apollo, Salesloft, and Outreach. Founded in London by Gautam Rishi
  (CEO) and Venki Pola (CTO), OneShot is backed by 42Cap, Seedcamp, and Addvia
  Ventures. Commercially it publishes three monthly tiers ($49/$99, $399 and
  $1,995), all sold through a "Book a Demo" motion with no self-serve checkout,
  and it operates a Vanta-hosted trust center at security.oneshot.ai alongside
  published GDPR and data-processing terms. This profile was surfaced as a
  Seedcamp portfolio company and enriched from OneShot's public surface.
  OneShot exposes NO public developer API: full contract discovery across
  www.oneshot.ai, the apex, app.oneshot.ai and every candidate api/docs/mcp
  subdomain found no OpenAPI, AsyncAPI, GraphQL SDL, MCP server or A2A agent
  card, and no developer portal or API reference exists. Its only first-party
  distributed package is an end-user Chrome extension.
