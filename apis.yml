aid: oneshot
name: OneShot
description: >-
  OneShot (oneshot.ai) is an autonomous outbound sales prospecting platform that
  uses generative AI, machine learning, and reinforcement learning to automate
  the manual work of B2B prospecting. It sources ideal-customer-profile (ICP)
  leads from 35+ data providers, manages email and domain health, generates
  hyper-personalized messaging for email and LinkedIn, and can run fully
  autonomous 24/7 outreach that books qualified meetings. The product ships as a
  Chrome extension and a web application, and integrates natively with HubSpot,
  Salesforce, Apollo, Salesloft, and Outreach. Founded in London by Gautam Rishi
  (CEO) and Venki Pola (CTO), OneShot is backed by 42Cap, Seedcamp, and Addvia
  Ventures. This profile was surfaced as a Seedcamp portfolio company and
  enriched from OneShot's public surface; it does not expose a public developer
  API, OpenAPI specification, or developer portal.
